          type: [string, "null"]
        closedDays:
          type: [string, "null"]
        dinnerBudget:
          type: [string, "null"]
        access:
          type: [string, "null"]
        stationName:
          type: [string, "null"]
        detailUrl:
          type: [string, "null"]
          format: uri
        coordinates:
          oneOf:
            - $ref: "#/components/schemas/RestaurantCoordinates"
            - type: "null"
        source:
          type: string
          enum: [hotpepper]

    RestaurantSearchRoom:
      type: object
      additionalProperties: false
      required: [id, status, version, expiresAt]
