    RestaurantVoteResult:
      type: object
      additionalProperties: false
      required: [restaurant, likeCount, decisionMethod, decidedAt]
      properties:
        restaurant:
          $ref: "#/components/schemas/RestaurantCandidate"
        likeCount:
