        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [restaurant_voting, decided]
        version:
          type: integer
          format: int64
          minimum: 1
        expiresAt:
          type: string
          format: date-time

    RestaurantSearchResponse:
      type: object
      additionalProperties: false
      required: [data]
